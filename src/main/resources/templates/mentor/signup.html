<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Registration - Mentor Mentee Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Role Switcher Navigation Bar -->
                <div class="role-toggle-tabs">
                    <a th:href="@{/mentor/signup}" class="role-toggle-tab active">
                        Faculty Mentor Signup
                    </a>
                    <a th:href="@{/mentee/signup}" class="role-toggle-tab">
                        Student Mentee Signup
                    </a>
                </div>

                <div class="form-card">
                    <div class="text-center mb-4">
                        <span class="badge bg-primary px-3 py-2 rounded-pill font-weight-bold mb-2">Faculty Registration</span>
                        <h2 class="fw-bold text-dark mb-1">Create Mentor Account</h2>
                        <p class="text-muted small mb-0">Fill out your profile details & unique Faculty ID to start receiving assigned mentees</p>
                    </div>

                    <form th:action="@{/mentor/signup}" th:object="${mentorSignupDto}" method="post">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label fw-bold text-dark">Full Name</label>
                                <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="e.g. Prof. Ravi Kumar" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="facultyId" class="form-label fw-bold text-dark">Faculty ID</label>
                                <input type="text" th:field="*{facultyId}" class="form-control border-primary" id="facultyId" placeholder="e.g. FAC1001" required>
                                <small class="form-text text-muted">Format: FAC followed by 4-6 digits (e.g. FAC1001)</small>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('facultyId')}" th:errors="*{facultyId}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="department" class="form-label fw-bold text-dark">Department</label>
                                <input type="text" th:field="*{department}" class="form-control" id="department" placeholder="e.g. CSE" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label fw-bold text-dark">Phone Number (10 digits)</label>
                                <input type="text" th:field="*{phone}" class="form-control" id="phone" placeholder="9876543210" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold text-dark">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="ravi@example.com" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold text-dark">Username</label>
                            <input type="text" th:field="*{username}" class="form-control" id="username" placeholder="Choose a unique username" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label fw-bold text-dark">Password</label>
                                <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="At least 6 characters" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirmPassword" class="form-label fw-bold text-dark">Confirm Password</label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" placeholder="Re-enter password" required>
                                <div id="passwordMatchHint" class="form-text"></div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-6 mt-2">
                            Complete Mentor Registration &rarr;
                        </button>
                    </form>

                    <div class="text-center mt-4 border-top pt-3">
                        <p class="text-muted small mb-0">Already registered? <a th:href="@{/mentor/login}" class="text-primary fw-bold text-decoration-none">Sign In Here &rarr;</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
