<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Student Mentee Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        
        <!-- Navigation Breadcrumb Toolbar -->
        <div class="quick-toolbar">
            <nav aria-label="breadcrumb" class="mb-0">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/mentee/dashboard}" class="text-decoration-none">Mentee Dashboard</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Change Password</li>
                </ol>
            </nav>
            <div>
                <a th:href="@{/mentee/dashboard}" class="btn btn-outline-secondary btn-sm fw-bold rounded-pill px-3">
                    &larr; Back to Dashboard
                </a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="form-card border-top border-info border-4">
                    <div class="text-center mb-4">
                        <span class="badge bg-info px-3 py-2 rounded-pill font-weight-bold mb-2">Student Mentee</span>
                        <h2 class="fw-bold text-dark mb-1">Change Password</h2>
                        <p class="text-muted small mb-0">Enter your current password and set a new secure password</p>
                    </div>

                    <form th:action="@{/mentee/change-password}" th:object="${changePasswordDto}" method="post">
                        
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label fw-bold text-dark">Current Password</label>
                            <input type="password" th:field="*{oldPassword}" class="form-control" id="oldPassword" placeholder="Enter current password" required autofocus>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold text-dark">New Password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control" id="password" placeholder="At least 6 characters" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-bold text-dark">Confirm New Password</label>
                            <input type="password" th:field="*{confirmNewPassword}" class="form-control" id="confirmPassword" placeholder="Re-enter new password" required>
                            <div id="passwordMatchHint" class="form-text"></div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-6 mb-3" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);">
                            Update Password &rarr;
                        </button>
                    </form>

                    <div class="text-center border-top pt-3">
                        <a th:href="@{/mentee/dashboard}" class="text-muted small text-decoration-none fw-semibold">
                            &larr; Cancel and return to Mentee Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
