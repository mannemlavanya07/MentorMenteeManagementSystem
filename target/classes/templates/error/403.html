<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Denied - Mentor Mentee Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5 text-center">
        <div class="row justify-content-center py-4">
            <div class="col-md-7 col-lg-6">
                <div class="card custom-card p-5 border-top border-danger border-4">
                    <span class="badge bg-danger text-white rounded-pill px-3 py-2 fw-bold w-auto mx-auto mb-3">HTTP 403 Security</span>
                    <h1 class="display-3 fw-bold text-danger mb-2">403</h1>
                    <h3 class="fw-bold text-dark mb-3">Access Restricted</h3>
                    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'You do not have permission or role authority to view this student profile or dashboard page.'}">
                        You do not have permission to view or access this resource.
                    </p>

                    <!-- Navigation Action Buttons -->
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a th:href="@{/}" class="nav-pill-btn nav-pill-btn-primary px-4 py-2">
                            Return to Home Page &rarr;
                        </a>
                        <a th:href="@{/mentor/login}" class="nav-pill-btn nav-pill-btn-outline px-4 py-2">
                            Faculty Mentor Login
                        </a>
                        <a th:href="@{/mentee/login}" class="nav-pill-btn nav-pill-btn-outline px-4 py-2">
                            Student Mentee Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
